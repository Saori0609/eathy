<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>Eathy</title>
    <link rel="stylesheet" href="estilos_sesion.css">
</head>

<body>
    <main class="contenedor">
        <section class="seccion-imagen">
            <div class="contenido-imagen">
                <span class="etiqueta">HUERTO ESCOLAR</span>

                <h1>Eathy</h1>

                <p>
                    Cultivando conocimeinto,
                    cosechando futuro.
                </p>

            </div>

        </section>
        <section class="seccion-login">
            <div class="formulario-contendor">
                <div class="logo">
                    <span class="icono"></span>
                    <h2>Eathy</h2>
                </div>
                <h3>Login</h3>

                <p class="descripcion">
                    Ingresa tus datos para acceder a tu cuenta.
                </p>
                <form action="login.php">
                    <div class="campo">


                        <label for="usuario">
                            Email
                        </label>
                        <input type="text" 
                        id="usuario" name="usuario" 
                        placeholder="Ingresa tu usuario"
                        autocomplete="username" 
                        required>
                    </div>
                    <div class="campo">
                        <label for="usuario">
                            Contraseña
                        </label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu comtraseña"
                            autocomplete="current-password" required>

                    </div>
                    <button type="submit" class="btn-login" onclick="window.location.href='PRINCIPAL.html'">
                        Inciar Sesión
                    </button>
                </form>

            </div>
        </section>
    </main>
